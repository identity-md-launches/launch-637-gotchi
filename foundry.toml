# Foundry configuration for the $GOTCHI Sepolia workflow.
#
# Everything needed to build and test is vendored under lib/ as ordinary files, so the project
# compiles offline once solc 0.8.26 is present in the local Foundry cache. No ffi, no filesystem
# permissions, no external compiler binary.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# v4-core needs the cancun EVM for tstore/tload; the compiler is pinned by version only.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# Deterministic creation code: no metadata hash appended, so the attested bytecode depends only on
# the sources and the compiler settings, not on file paths.
bytecode_hash = "none"

ffi = false
fs_permissions = []

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
